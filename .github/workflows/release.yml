name: Automated Release & Tagging

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump override (patch, minor, major, or explicit semver e.g. 2.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build, Package & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for existing tags
        id: check_tags
        shell: pwsh
        run: |
          $tags = git tag -l "v*"
          if (-not $tags) {
            Write-Host "No existing v* tags found. Initial tag will be seeded as v2.0.0."
            echo "has_tags=false" >> $env:GITHUB_OUTPUT
          } else {
            $latest = git tag -l --sort=-v:refname "v*" | Select-Object -First 1
            Write-Host "Found existing tags. Latest tag: $latest"
            echo "has_tags=true" >> $env:GITHUB_OUTPUT
          }

      - name: Calculate initial version tag (v2.0.0)
        if: steps.check_tags.outputs.has_tags == 'false' && github.event.inputs.bump == ''
        id: tag_version_init
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: "2.0.0"
          tag_prefix: "v"
          release_branches: "main"

      - name: Calculate bumped version tag
        if: steps.check_tags.outputs.has_tags == 'true' || github.event.inputs.bump != ''
        id: tag_version_bump
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ github.event.inputs.bump != '' && github.event.inputs.bump || 'patch' }}
          tag_prefix: "v"
          release_branches: "main"

      - name: Resolve target version
        id: resolve_version
        shell: pwsh
        run: |
          $tag = "${{ steps.tag_version_init.outputs.new_tag }}"
          $ver = "${{ steps.tag_version_init.outputs.new_version }}"
          if (-not $tag) {
            $tag = "${{ steps.tag_version_bump.outputs.new_tag }}"
            $ver = "${{ steps.tag_version_bump.outputs.new_version }}"
          }
          if (-not $tag) {
            Write-Error "Failed to determine target release tag."
            exit 1
          }
          Write-Host "=== Target Release Tag: $tag ==="
          Write-Host "=== Target Suite Version: $ver ==="
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Configure CMake (MSVC x64)
        run: |
          cmake -B build -A x64 -DBCD2000_VERSION="${{ steps.resolve_version.outputs.version }}"

      - name: Build Driver Suite (Release x64)
        run: |
          cmake --build build --config Release --parallel

      - name: Build NSIS Setup Bundle (Behringer_BCD2000_Setup_x64.exe)
        run: |
          cmake --build build --config Release --target bcd2000_installer

      - name: Package Portable Binaries Archive
        shell: pwsh
        run: |
          $ver = "${{ steps.resolve_version.outputs.version }}"
          $zipName = "bcd2000_v${ver}_binaries_x64.zip"
          $stagingDir = "build/portable_staging"

          New-Item -ItemType Directory -Path "$stagingDir/tools" -Force | Out-Null
          New-Item -ItemType Directory -Path "$stagingDir/presets/mixxx" -Force | Out-Null
          New-Item -ItemType Directory -Path "$stagingDir/scripts" -Force | Out-Null

          Copy-Item "build/Release/bcd2000_asio.dll" "$stagingDir/"
          Copy-Item "build/Release/bcd2000_midi.dll" "$stagingDir/"
          Copy-Item "build/Release/bcd2000_winusb_setup.exe" "$stagingDir/"
          Copy-Item "README.md" "$stagingDir/"
          Copy-Item "LICENSE" "$stagingDir/LICENSE.txt"
          Copy-Item "AUTHORS" "$stagingDir/AUTHORS.txt"

          Copy-Item "build/Release/bcd2000_diag_usb.exe" "$stagingDir/tools/"
          Copy-Item "build/Release/bcd2000_diag_midi.exe" "$stagingDir/tools/"
          Copy-Item "build/Release/bcd2000_diag_audio.exe" "$stagingDir/tools/"
          Copy-Item "build/Release/hostsample.exe" "$stagingDir/tools/"
          Copy-Item "build/Release/hostsample_midi.exe" "$stagingDir/tools/"

          Copy-Item "presets/mixxx/*" "$stagingDir/presets/mixxx/"
          Copy-Item "scripts/*" "$stagingDir/scripts/"

          Compress-Archive -Path "$stagingDir/*" -DestinationPath $zipName -Force
          Write-Host "Successfully packaged portable ZIP: $zipName"

      - name: Generate Cryptographic SHA-256 Checksums
        shell: pwsh
        run: |
          $ver = "${{ steps.resolve_version.outputs.version }}"
          $installer = "build/Release/Behringer_BCD2000_Setup_x64.exe"
          $portableZip = "bcd2000_v${ver}_binaries_x64.zip"

          $hashes = Get-FileHash -Algorithm SHA256 $installer, $portableZip | ForEach-Object {
            "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))"
          }
          $hashes | Set-Content "SHA256SUMS.txt" -Encoding UTF8
          Write-Host "=== Generated SHA256SUMS.txt ==="
          Get-Content "SHA256SUMS.txt"

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_version.outputs.tag }}
          name: "Behringer BCD2000 Driver Suite ${{ steps.resolve_version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/Release/Behringer_BCD2000_Setup_x64.exe
            bcd2000_v${{ steps.resolve_version.outputs.version }}_binaries_x64.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

